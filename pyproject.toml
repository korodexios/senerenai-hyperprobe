[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "senerenai-hyperprobe"
version = "1.11.3"
description = "Interpretable LLM sampling benchmark and tuner for OpenAI-compatible APIs"
readme = "readme.md"
requires-python = ">=3.10"
license = { file = "license" }
authors = [{ name = "Senerenai-HyperProbe contributors" }]
keywords = ["llm", "large-language-models", "sampling", "temperature", "min-p", "top-p", "repetition-penalty", "benchmark", "evaluation", "openai-compatible", "llama.cpp", "vllm", "ollama", "multilingual", "ai-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []


[tool.setuptools]
py-modules = ["common", "config", "runner", "stage1_coarse", "stage2_refine", "stage3_finest", "visualizer", "probe_utils", "probe_refusal", "probe_niah", "probe_settings"]

[tool.setuptools.packages.find]
include = ["grader", "tests"]
